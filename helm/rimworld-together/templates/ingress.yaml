apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: {{ template "rimworld-together.fullname" . }}-ingress
spec:
  entryPoints:
    - rimworld
  routes:
  - match: HostSNI(`*`)
    priority: 10
    services:
      - name: {{ template "rimworld-together.fullname" . }}
        port: {{ .Values.service.port }}